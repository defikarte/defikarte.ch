name: "Mobile: Build"

# Builds the Capacitor app in src/app for both platforms and publishes the .apk, .aab and .ipa
# as a GitHub release. Store uploads are handled by deploy-mobile.yml, which runs after this
# workflow completes.
#
# Version: MAJOR.MINOR from src/app/package.json, patch = build number (run number + offset),
# e.g. 1.0.52 with Android versionCode / iOS build number 52. The tag v1.0.52 is created here.
# Pushes to main produce a release; manual runs on other branches produce a beta prerelease.
#
# One-time credential setup (EAS export, App Store Connect API key, Play service
# account, GitHub secrets): see docs/mobile-release-setup.md

on:
  push:
    branches:
      - main
    paths:
      - "src/app/**"
      - "src/shared/**"
      - ".github/workflows/build-mobile.yml"

  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub release and deploy to TestFlight / Play internal (beta if not on main)"
        type: boolean
        default: true
      platform:
        description: "Platform(s) to build (a release requires both)"
        type: choice
        options: [both, ios, android]
        default: both

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      android_version_name: ${{ steps.version.outputs.android_version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      is_release: ${{ steps.version.outputs.is_release }}
      build_ios: ${{ github.event_name == 'push' || inputs.platform != 'android' }}
      build_android: ${{ github.event_name == 'push' || inputs.platform != 'ios' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version, build number and tag
        id: version
        env:
          # Set the MOBILE_BUILD_NUMBER_OFFSET repository variable if the previously
          # published (Expo) app already used higher build numbers than the run number.
          OFFSET: ${{ vars.MOBILE_BUILD_NUMBER_OFFSET || 0 }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT: ${{ inputs.release }}
          PLATFORM_INPUT: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          package_version="$(jq -r .version src/app/package.json)"
          if ! [[ "$package_version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            echo "::error::src/app/package.json version '$package_version' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          build_number=$(( GITHUB_RUN_NUMBER + OFFSET ))
          version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${build_number}"

          if [ "$EVENT_NAME" = "push" ] || [ "$RELEASE_INPUT" = "true" ]; then
            is_release=true
          else
            is_release=false
          fi
          if [ "$is_release" = "true" ] && [ "$EVENT_NAME" != "push" ] && [ "$PLATFORM_INPUT" != "both" ]; then
            echo "::error::A release requires platform 'both'"
            exit 1
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            prerelease=false
            suffix=""
          else
            prerelease=true
            suffix="-beta"
          fi

          {
            echo "version_name=${version_name}"
            echo "android_version_name=${version_name}${suffix}"
            echo "build_number=${build_number}"
            echo "tag=v${version_name}${suffix}"
            echo "prerelease=${prerelease}"
            echo "is_release=${is_release}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "Version ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.build_number }})"
            echo ""
            echo "Tag: ${{ steps.version.outputs.tag }} — release: ${{ steps.version.outputs.is_release }}, prerelease: ${{ steps.version.outputs.prerelease }}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    needs: prepare
    if: needs.prepare.outputs.build_android == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_BACKEND_API: ${{ vars.BACKEND_API_URL }}
      VITE_BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      VITE_MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install dependencies
        working-directory: ./src/app
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: ./src/app
        run: pnpm run build

      - name: Capacitor sync
        working-directory: ./src/app
        run: pnpm run sync:android

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build AAB and APK
        working-directory: ./src/app/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ needs.prepare.outputs.android_version_name }}
          ANDROID_VERSION_CODE: ${{ needs.prepare.outputs.build_number }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Collect outputs
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/android-out"
          mkdir -p "$out"
          cp src/app/android/app/build/outputs/bundle/release/app-release.aab "$out/defikarte-$TAG.aab"
          cp src/app/android/app/build/outputs/apk/release/app-release.apk "$out/defikarte-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/android-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  build-ios:
    needs: prepare
    if: needs.prepare.outputs.build_ios == 'true'
    runs-on: macos-15
    environment: production
    env:
      VITE_BACKEND_API: ${{ vars.BACKEND_API_URL }}
      VITE_BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
      VITE_MAPTILER_API_KEY: ${{ secrets.MAPTILER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: src/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./src/app
        run: pnpm install --frozen-lockfile

      - name: Build web bundle
        working-directory: ./src/app
        run: pnpm run build

      - name: Capacitor sync
        working-directory: ./src/app
        run: pnpm run sync:ios

      - name: Import signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          keychain_password="$(uuidgen)"
          echo "KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$RUNNER_TEMP/dist.p12"

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$profiles/app-store.mobileprovision"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>ch.defikarte.app</key>
              <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Archive
        working-directory: ./src/app/ios/App
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="${{ needs.prepare.outputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ needs.prepare.outputs.build_number }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: Export IPA
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ios-out"
          mv "$RUNNER_TEMP/ios-out/App.ipa" "$RUNNER_TEMP/ios-out/defikarte-$TAG.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/ios-out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Clean up keychain and profile
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/app-store.mobileprovision"

  release:
    needs: [prepare, build-android, build-ios]
    if: needs.prepare.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{android,ios}"
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Re-run of the same workflow run: replace the assets of the existing release.
            gh release upload "$TAG" artifacts/* --clobber -R "$GITHUB_REPOSITORY"
          else
            flags=()
            if [ "$PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "$TAG (build $BUILD_NUMBER)" \
              --generate-notes \
              "${flags[@]}" \
              -R "$GITHUB_REPOSITORY"
          fi
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # Handoff for deploy-mobile.yml, which runs on completion of this workflow.
      - name: Write release metadata
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p release-meta
          echo "$TAG" > release-meta/release-tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta/release-tag.txt
          if-no-files-found: error
          retention-days: 30
