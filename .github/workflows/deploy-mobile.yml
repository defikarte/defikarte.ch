name: "Mobile: Deploy to Stores"

# Uploads the .aab / .ipa of a GitHub release (created by build-mobile.yml) to the Google Play
# internal testing track and TestFlight. Runs automatically after every release-producing
# "Mobile: Build" run, or manually for any existing release tag.
#
# Note: workflow_run only fires once this file is on the default branch.

on:
  workflow_run:
    workflows: ["Mobile: Build"]
    types: [completed]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v1.0.52"
        type: string
        required: true
      platform:
        description: "Platform(s) to deploy"
        type: choice
        options: [both, ios, android]
        default: both

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      deploy_android: ${{ steps.tag.outputs.tag != '' && (github.event_name == 'workflow_run' || inputs.platform != 'ios') }}
      deploy_ios: ${{ steps.tag.outputs.tag != '' && (github.event_name == 'workflow_run' || inputs.platform != 'android') }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ inputs.tag }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$TAG_INPUT"
          elif gh run download "$RUN_ID" -n release-meta -D release-meta -R "$GITHUB_REPOSITORY"; then
            tag="$(cat release-meta/release-tag.txt)"
          else
            echo "Build run $RUN_ID produced no release — nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Deploying release $tag" >> "$GITHUB_STEP_SUMMARY"

  deploy-android:
    needs: resolve
    if: needs.resolve.outputs.deploy_android == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download AAB from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release download "$TAG" -p '*.aab' -D artifacts -R "$GITHUB_REPOSITORY"

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.defikarte.app
          releaseFiles: artifacts/*.aab
          track: internal
          status: completed

  deploy-ios:
    needs: resolve
    if: needs.resolve.outputs.deploy_ios == 'true'
    runs-on: macos-15
    environment: production
    steps:
      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: gh release download "$TAG" -p '*.ipa' -D artifacts -R "$GITHUB_REPOSITORY"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_PRIVATE_KEY_P8_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          ipa="$(ls artifacts/*.ipa | head -n1)"
          xcrun altool --validate-app -t ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app -t ios -f "$ipa" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
